name: Setup Django
description: Installere python og dependencies, blant annet Django. 
runs:
  using: composite
  steps:
    - name: Installer dependencies
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo 'deb http://deb.debian.org/debian trixie main' >> /etc/apt/sources.list
        apt update
        packages=$(sed -n 's/.*# apt //p' requirements.txt | tr '\n' ' ')
        apt install -y python3-venv $packages

        python3 -m venv venv --system-site-packages
        source venv/bin/activate

        # Vi treng pytailwindcss i workflowen for å verifiser at tailwind e kjørt, men ikkje i prod! 
        python3 -m pip install --upgrade -r <(grep -ve apt requirements.txt) 
