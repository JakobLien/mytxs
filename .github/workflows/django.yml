name: Django CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DJANGO_SECRET: "1234"

jobs:
  committed-migrations:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: python manage.py makemigrations --check
        shell: bash
        run: |
          source venv/bin/activate
          python manage.py makemigrations --check

  committed-tailwind:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Regenerer tailwind uten endringer
        shell: bash
        run: |
          source venv/bin/activate
          tailwindcss --cwd mytxs -i static/mytxs/inputStyles.css -o static/mytxs/styles.css --minify
          tailwindcss --cwd docs -o styles.css --minify

          # git diff --exit-code # burda funka fjell, men MIT licence versjonen endre seg over tid
          # så derfor gjør vi følgende istedet, som ser etter linjer i diffen som ikke er kommentarer

          if [[ $(git diff -U0 | grep "^[+-][^/+-]") ]]; then
            git diff
            exit 1
          fi

  django-test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgrespassword
      PGDATABASE: postgres
    steps: 
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: python manage.py test
        shell: bash
        run:
          source venv/bin/activate
          python manage.py test
